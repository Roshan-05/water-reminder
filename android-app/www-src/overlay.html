<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Water Reminder</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
      }

      body {
        position: relative;
      }

      #confetti {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
        z-index: 2;
      }

      #confetti.active {
        opacity: 1;
      }

      #confetti::before {
        content: '🎉💧🎉';
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: #20222b;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        box-sizing: border-box;
      }

      #character {
        position: absolute;
        bottom: 0;
        right: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
        will-change: transform;
      }

      #character img {
        height: 150px;
        width: auto;
        image-rendering: pixelated;
        display: block;
      }

      #bubble {
        position: absolute;
        top: 16px;
        left: 16px;
        right: 16px;
        background: #20222b;
        border: 1px solid #3a3d4a;
        border-radius: 16px;
        padding: 16px 18px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 300ms ease, transform 300ms ease;
        pointer-events: none;
      }

      #bubble.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      #bubble p {
        margin: 0 0 14px 0;
        font-size: 16px;
        color: #e6e7eb;
        text-align: center;
      }

      #bubble-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }

      #bubble-buttons button {
        flex: 1;
        padding: 12px 10px;
        font-size: 15px;
        border: none;
        border-radius: 10px;
      }

      #btn-yes {
        background: #2f9e6b;
        color: #eafff2;
      }

      #snooze-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #snooze-label {
        font-size: 12px;
        color: #9296a3;
        margin-right: 2px;
      }

      .snooze-btn {
        flex: 1;
        padding: 9px 6px;
        font-size: 13px;
        border: none;
        border-radius: 8px;
        background: #343744;
        color: #c7cad3;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="confetti"></div>
      <div id="character">
        <img id="sprite-img" alt="" />
      </div>
      <div id="bubble">
        <p id="bubble-text">Did you drink water?</p>
        <div id="bubble-buttons">
          <button id="btn-yes">Yes, I drank!</button>
        </div>
        <div id="snooze-row">
          <span id="snooze-label">Snooze</span>
          <button class="snooze-btn" data-minutes="5">5m</button>
          <button class="snooze-btn" data-minutes="10">10m</button>
          <button class="snooze-btn" data-minutes="15">15m</button>
        </div>
      </div>
    </div>
    <script src="js/overlay.js" type="module"></script>
  </body>
</html>
