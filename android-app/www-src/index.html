<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Water Reminder</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
        text-align: center;
      }
      button {
        display: block;
        width: 100%;
        max-width: 320px;
        margin: 12px auto 0;
        padding: 14px 20px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        background: #4caf50;
        color: white;
      }
      #pause-btn {
        background: #ff9800;
      }
      #signout-btn {
        background: #9e9e9e;
      }
      #count {
        font-size: 48px;
        font-weight: bold;
        margin: 8px 0 0;
      }
      #status {
        margin-top: 16px;
        font-size: 14px;
        color: #555555;
      }
    </style>
  </head>
  <body>
    <h2>Water Reminder</h2>
    <p id="count">—</p>
    <p id="status">Loading...</p>
    <button id="drink-btn">I drank water</button>
    <button id="pause-btn">Pause</button>
    <button id="signout-btn">Sign out</button>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
